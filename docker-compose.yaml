services:
  zmk-build:
    image: ${ZMK_IMAGE:-zmkfirmware/zmk-build-arm:4.1-branch}
    working_dir: /workspace/config-repo
    volumes:
      - .:/workspace/config-repo
      - ./zmk-workspace:/workspace/west-workspace
      - ./output:/workspace/output
    command: python3 /workspace/config-repo/scripts/build.py